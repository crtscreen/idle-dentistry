name: Build release

on:
    workflow_dispatch:
        inputs:
           tag:
            description: "v1.2.0"
            required: true
            type: string

permissions:
    contents: read

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      platform: windows-x74
                      arch: x64
                    - os: ubuntu-22.04
                      platform: linux-x64
                      arch: x64
                    - os: macos-15-intel
                      platform: macos-x64
                      arch: x64
                    - os: macos-15
                      platform: macos-arm64
                      arch: arm64
        
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                architecture: ${{ matrix.arch }}
            
            - name: Install dependencies
              run: python -m pip install -r requirements.txt pyinstaller
            
            - name: Build executable
              run: python -m PyInstaller --clean --noconfirm idle-dentistry.spec
            
            - name: Check and package executable
              shell: python
              run: |
                import os
                import subprocess
                import tarfile
                import zipfile
                from pathlib import Path

                windows = os.name == "nt"
                filename = "idle-dentistry.exe" if windows else "idle-dentistry"
                binary = Path("dist") / filename

                for flag in ("--version", "--check-cosmetics"):
                    subprocess.run([str(binary.resolve()), flag], check=True)
                
                assets = Path("assets")
                assets.mkdir(exist_ok=True)
                name = assets / "idle-dentistry-${{ matrix.platform }}"

                if windows:
                    with zipfile.ZipFile(
                        f"{name}.zip", "w", zipfile.ZIP_DEFLATED
                    ) as archive:
                        archive.write(binary, arcname=filename)
                else:
                    with tarfile.open(f"{name}.tar.gz", "w:gz") as archive:
                        archive.add(binary, arcname=filename)
            
            - uses: actions/upload-artifact@v4
              with:
                name: ${{ matrix.platform }}
                path: assets/*
                if-no-files-found: error

    release:
        needs: build
        runs-on: ubuntu-22.04
        permissions:
            contents: write

        steps:
            - uses: actions/download-artifact@v4
              with:
                path: assets
                merge-multiple: True
            
            - name: Create draft release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GH_REPO: ${{ github.repository }}
                RELEASE_TAG: ${{ inputs.tag }}
                RELEASE_COMMIT: ${{ github.sha }}
              run: |
                gh release create "$RELEASE_TAG" assets/* \
                  --target "$RELEASE_COMMIT" \
                  --title "$RELEASE_TAG" \
                  --generate-notes \
                  --draft